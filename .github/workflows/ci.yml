name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
      - name: Frontend lint, build, dist test
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=high
      - name: Bindings are up to date
        run: |
          wails3 generate bindings -clean=true -ts -i -f '-tags production'
          git diff --exit-code -- frontend/bindings
      - name: Go vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Worker fuzz
        run: go test -run=^$ -fuzz=FuzzParseArgs -fuzztime=60s ./internal/worker/
      - name: Security scanners
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          staticcheck ./...
          GOOS=windows staticcheck ./...
          gosec -severity high -confidence medium -exclude=G115 -exclude-dir=tools ./...
          govulncheck ./...
      - name: Build Windows exe
        run: wails3 build GOOS=windows VERSION=0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: netwick-windows
          path: bin/netwick.exe

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit and read-only integration tests
        run: go test ./...
